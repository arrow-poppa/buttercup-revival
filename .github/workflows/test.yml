name: Windows and Linux
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
      - run: python -m pytest tests/backend -q
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # test:settings-browser and test:connection-browser call chrome.runtime.reload(),
      # which unloads any extension started with --load-extension in headless
      # Chromium, so they cannot pass here and are left out of this workflow.
      - run: npm run test:deepinfra-browser
      - run: npm run test:groq-browser
      - run: npm run test:assistant-browser
